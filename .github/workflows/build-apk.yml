name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          unzip -q FramePilot-GitHub-Build.zip -d source
          cd source/FramePilotFixed

          printf '%s\n' \
            'android.useAndroidX=true' \
            'android.enableJetifier=true' \
            > gradle.properties

          printf '%s\n' \
            '' \
            'android {' \
            '    compileOptions {' \
            '        sourceCompatibility = org.gradle.api.JavaVersion.VERSION_17' \
            '        targetCompatibility = org.gradle.api.JavaVersion.VERSION_17' \
            '    }' \
            '}' \
            >> app/build.gradle.kts

          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/gradle-8.7/bin/gradle" :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FramePilot-APK
          path: source/FramePilotFixed/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
